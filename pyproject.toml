[project]
name = "ap1-datasets"
version = "0.1.0"
description = "Builds the WE-Autopilot AP1 datasets published on Hugging Face (WEAP26)"
requires-python = ">=3.12,<3.13"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap1_datasets"]

# Environment: ROS 2 Jazzy from RoboStack (conda), no Docker or system ROS needed.
[tool.pixi.workspace]
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
ros-jazzy-vision-msgs = "*"
numpy = "*"
pyyaml = "*"
pytest = "*"
ruff = "*"
uv = "*"                  # runs kitti2mcap isolated (uvx), see build.py
huggingface_hub = "*"     # hf CLI for uploads

[tool.pixi.pypi-dependencies]
ap1-datasets = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
build-kitti = "python -m ap1_datasets.kitti.build"
upload-kitti = "hf upload WEAP26/KITTI_mcap out/kitti/hf . --repo-type dataset"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# ROS imports follow pytest.importorskip so the test skips cleanly without ROS
"tests/test_kitti_adapter.py" = ["E402"]
